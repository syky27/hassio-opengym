name: Follow upstream releases
on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          new=$(gh api repos/DuarteSantos8/openGym/releases/latest --jq .tag_name | sed 's/^v//')
          old=$(sed -n 's/^ARG OPENGYM_VERSION=//p' opengym/Dockerfile)
          echo "$new" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'
          [ "$new" != "$old" ] || exit 0
          branch="opengym-$new"
          git ls-remote --exit-code --heads origin "$branch" && exit 0
          # The image for a release is published a little after the release itself.
          docker manifest inspect "ghcr.io/duartesantos8/opengym-web:$new" > /dev/null
          sed -i "s/^ARG OPENGYM_VERSION=.*/ARG OPENGYM_VERSION=$new/" opengym/Dockerfile
          sed -i "s/^version: .*/version: \"$new\"/" opengym/config.yaml
          sed -i "0,/^## /s//## $new\n\n- openGym $new: https:\/\/github.com\/DuarteSantos8\/openGym\/releases\/tag\/v$new\n\n## /" opengym/CHANGELOG.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git commit -am "openGym $new"
          git push origin "$branch"
          gh pr create --title "openGym $new" --body "Upstream release: https://github.com/DuarteSantos8/openGym/releases/tag/v$new"
