# Port 8099 is the ingress port: Home Assistant has already authenticated whoever comes through
# it, so only the Supervisor (172.30.32.2) may connect. Port 8080 is the optional direct port.
map "$server_port:$remote_addr" $ingress_denied {
    default 0;
    "~^8099:" 1;
    "8099:172.30.32.2" 0;
}

# openGym refuses a state-changing request whose Origin is not the one configured address. Home
# Assistant is reached at several (local IP, hostname, Nabu Casa), and on plain http the browser
# sends no Sec-Fetch-Site for the API to go by. So: an Origin naming the very host the browser
# asked for is same-origin, and is dropped, which the API treats as "not a cross-site browser".
# Ingress reports that host in X-Forwarded-Host; on the direct port it is Host itself.
map "$server_port|$http_origin|$http_x_forwarded_host|$http_host" $api_origin {
    default $http_origin;
    "~^8099\|https?://(?<oh>[^|]+)\|\k<oh>\|" "";
    "~^8080\|https?://(?<oh>[^|]+)\|[^|]*\|\k<oh>$" "";
}
